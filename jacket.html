<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ian's Battle Jacket</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=New+Rocker&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    margin:0;

    background:#000;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;

    overflow:hidden; 

   animation:fadeIn 1.3s ease;

}

@keyframes fadeIn{

    from{

        opacity:0;
        transform:scale(.97);

    }

    to{

        opacity:1;
        transform:scale(1);

    }

}

h1{

    margin:30px 20px 20px;

    text-align:center;

    font-size:1.8rem;
    font-weight:normal;
    line-height:1.5;

}

.jacket{

    width:110vw;

    max-width:none;

    max-height:100vh;

    height:auto;

    display:block;

}

.jacket-container{

    position:relative;

    display:inline-block;

}

.patch{


    position:absolute;

    background:transparent;

    border:2px solid red;

    cursor:pointer;

}

#destroyerPatch{

    left:47.04%;

    top:33.62%;

    width:28%;

    height:17%;

    transform:translate(-50%, -50%);

}

#midnightPatch{

    left:51.03%;

    top:70.10%;

    width:28%;

    height:17%;

    transform:translate(-50%, -50%);

}

#dissectionPatch{

    left:15.53%;

    top:51.49%;

    width:28%;

    height:17%;

    transform:translate(-50%, -50%);

}

#eaglePatch{

    left:80.08%;

    top:54.59%;

    width:28%;

    height:17%;

    transform:translate(-50%, -50%);

}

</style>

</head>

<body>

<div class="jacket-container">

    <img class="jacket" src="images2/battle-jacket.jpg" alt="Ian's Battle Jacket">

    <button id="destroyerPatch" class="patch"></button>
    <button id="midnightPatch" class="patch"></button>
    <button id="dissectionPatch" class="patch"></button>
    <button id="eaglePatch" class="patch"></button>

</div>

<script>


const destroyerAudio = new Audio("Audio/destroyer.m4a");

document.getElementById("destroyerPatch").addEventListener("click", function(){

    destroyerAudio.currentTime = 0;

    destroyerAudio.play();

});

document.querySelector(".jacket").addEventListener("click", function(e){

    const rect = this.getBoundingClientRect();

    const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(2);
    const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(2);

    console.log(`X:${x}%  Y:${y}%`);

});

const midnightAudio = new Audio("Audio/keep_it_up_babe_200_203.m4a");

document.getElementById("midnightPatch").addEventListener("click", function(){

    midnightAudio.currentTime = 0;

    midnightAudio.play();

});

const dissectionAudio = new Audio("Audio/ian_hates_the_boots_7_12.m4a");

document.getElementById("dissectionPatch").addEventListener("click", function(){

    dissectionAudio.currentTime = 0;

    dissectionAudio.play();

});

const eagleAudio = new Audio("Audio/ian_i_love_you_from_2m04.m4a");

document.getElementById("eaglePatch").addEventListener("click", function(){

    eagleAudio.currentTime = 0;

    eagleAudio.play();

});

</script>

</body>

</html>
